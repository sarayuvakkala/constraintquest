<meta charset="utf-8">
<title>ConstraintQuest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a sunny green city. A 3D viewport of the city on top, white glass panels (rules, stats, controls) beside or below it. One committed bright look. */
:root{
  --night:#DDF1DD; --night-2:#CFEFFF; --glass:rgba(255,255,255,.86);--surf:#fff;--surf-a:rgba(255,255,255,.94);--surf-2:#E6F5EA;--edge:#fff; --glass-2:rgba(16,56,43,.06);
  --ink:#10382B; --ink-2:#3F6B58; --line:rgba(16,56,43,.2);
  --amber:#FF9F1C; --amber-d:#D97F00; --teal:#17874A; --pink:#E8467C; --violet:#6C5CE7; --ok:#17874A; --bad:#D6304C;
  --f-display:'Bungee','Arial Black',Impact,sans-serif; --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100%;
  background:linear-gradient(180deg,#BFE6FF 0,#E4F6E8 340px,#D5EDD3 100%) fixed var(--night);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.brand{font-family:var(--f-display);font-size:24px;background:none;border:0;padding:0;letter-spacing:.03em}
.brand span{color:var(--teal)}
.tools{display:flex;align-items:center;gap:14px;font-weight:700;font-size:13px;color:var(--ink-2)}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{width:110px;height:10px;border-radius:9px;background:rgba(16,56,43,.1);border:1px solid var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#3DBE6E,var(--amber));border-radius:9px;transition:width .6s}
.icon-btn{background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:800;color:var(--ink)}

/* buttons */
.btn{background:var(--surf);border:1.5px solid var(--line);color:var(--ink);padding:9px 16px;font-weight:800;border-radius:14px;transition:transform .1s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);background:#F0FAF2}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#FFB84D,var(--amber));border-color:var(--amber-d);color:#3A2100;box-shadow:0 4px 0 var(--amber-d)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#FFC465,#FFAA2E)}
.btn.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--amber-d)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:4px 0;color:var(--ink-2);text-decoration:underline;font-size:13px}

/* 3D viewport */
.vp{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--edge);
  background:linear-gradient(180deg,#4FAEF0 0%,#9AD3F7 45%,#D8F1E0 100%);
  height:clamp(340px,56vh,520px);box-shadow:0 18px 40px rgba(20,80,50,.25)}
.vp.tall{height:clamp(420px,72vh,660px)}
.vhost{position:absolute;inset:0}
.nightsky{position:absolute;inset:0;background:linear-gradient(180deg,#0E1B4D 0,#2B3A8C 60%,#5566B8 100%);opacity:0;pointer-events:none}
.vhost canvas{display:block;width:100%;height:100%;cursor:grab}
.vhost canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lab{position:absolute;left:0;top:0;font-weight:800;font-size:12px;color:var(--ink);white-space:nowrap;will-change:transform;transition:opacity .2s}
.lab.tiny{font-size:11px;opacity:.85;text-shadow:0 0 4px #fff,0 0 4px #fff}
.lab.tag{background:var(--surf-a);border:1px solid var(--line);padding:2px 9px;border-radius:99px}
.lab.warn{background:#D6304C;border-color:#D6304C;color:#fff}
.lab.isl{pointer-events:auto;cursor:pointer;text-align:center;background:var(--surf-a);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-family:inherit;color:var(--ink);box-shadow:0 6px 14px rgba(0,60,30,.2)}
.lab.isl b{display:block;font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:.02em}
.lab.isl small{display:block;font-size:11px;color:var(--ink-2);font-weight:800}
.lab.isl:hover,.lab.isl.on{border-color:var(--amber);background:#FFF6E3}
.lab.isl.done small{color:var(--ok)}
.toast{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 14px;border-radius:14px;background:var(--surf-a);border:2px solid var(--line);font-weight:700;font-size:14px;min-height:44px;pointer-events:none}
.toast.bad{border-color:var(--bad);color:#8F1730}
.toast.good{border-color:var(--ok);color:#0E5A30}
.dragchip{position:absolute;top:12px;right:12px;font-size:12px;font-weight:800;color:var(--ink-2);background:var(--surf-a);border:1px solid var(--line);border-radius:99px;padding:3px 10px;pointer-events:none;transition:opacity .6s}
.daybtn{position:absolute;right:12px;bottom:12px}
.vp.alarm::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px 20px rgba(255,60,90,.6);animation:alarm 1.4s ease-out forwards;pointer-events:none}
@keyframes alarm{0%{opacity:1}100%{opacity:0}}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-weight:700}

/* home */
.hero-over{position:absolute;left:20px;top:16px;right:20px;pointer-events:none;display:grid;gap:4px;max-width:520px}
.hero-over h1{font-size:clamp(22px,3.6vw,38px);text-shadow:0 2px 0 rgba(255,255,255,.7)}
.hero-over h1 em{font-style:normal;color:var(--teal)}
.hero-over p{margin:0;font-weight:800;color:var(--ink);font-size:14px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.card{display:grid;gap:4px;align-content:start;text-align:left;background:var(--glass);border:2px solid var(--edge);padding:14px;border-radius:18px;min-width:0;transition:transform .15s,border-color .15s;box-shadow:0 6px 16px rgba(20,80,50,.12)}
.card:hover{transform:translateY(-4px);border-color:var(--amber)}
.card .topic{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.card h3{font-size:17px}
.card p{margin:0;color:var(--ink-2);font-size:13px;font-weight:600}
.card .foot{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:24px;font-size:12px;font-weight:800;color:var(--ink-2)}
.badge{color:var(--ok);border:1.5px solid var(--ok);padding:0 8px;border-radius:99px;font-size:11px}
.stars{letter-spacing:2px;font-size:17px;color:rgba(16,56,43,.18)}
.stars .on{color:var(--amber);text-shadow:0 0 8px rgba(255,159,28,.5)}

/* district shell */
.dhead{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-block:8px 12px}
.dhead h2{font-size:clamp(26px,5vw,42px)}
.learn{background:var(--glass);border:2px solid var(--edge);border-radius:16px;padding:12px 16px;max-width:86ch;margin:0 0 14px;font-weight:600;color:var(--ink-2)}
.learn b{color:var(--teal)}
.stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:14px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.dock{display:grid;gap:10px;margin-top:12px}
.side{display:grid;gap:12px;min-width:0}
.panel{background:var(--glass);border:2px solid var(--edge);border-radius:18px;padding:14px;min-width:0;box-shadow:0 6px 16px rgba(20,80,50,.1)}
.panel h3{font-size:15px;margin-bottom:8px;color:var(--teal)}
.panel p{margin:0;font-weight:600;color:var(--ink-2);font-size:14px}
.stat{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;border-bottom:1px dashed var(--line);padding-block:4px}
.stat:last-child{border-bottom:0}
.stat b{font-weight:800;color:var(--ink)}
.hearts{color:var(--bad);letter-spacing:3px}

/* palette */
.pal{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surf);font-weight:800;transition:transform .1s}
.sw:hover:not(:disabled){transform:translateY(-2px)}
.sw:disabled{opacity:.4;cursor:not-allowed}
.sw i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.sw.on{background:var(--amber);color:#3A2100;border-color:var(--amber-d)}
.sw.clash{text-decoration:line-through;opacity:.65}
.sw.hintc{outline:3px dashed var(--amber);outline-offset:2px}

/* rules */
.rules{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14px;font-weight:700;align-items:start}
.rules .st{font-weight:800}
.rules .ok{color:var(--ok)}.rules .bad{color:var(--bad)}.rules .wait{color:var(--ink-2)}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-left:6px}
.cspbox{display:grid;gap:3px;font-size:13px;font-weight:700;color:var(--ink-2)}
.cspbox b{color:var(--teal)}

/* tree */
.tree{max-height:230px;overflow:auto;font-size:12.5px;font-weight:700}
.tree ul{list-style:none;margin:0;padding-left:14px;border-left:1.5px solid var(--line)}
.tree>ul{border-left:0;padding-left:0}
.tree li{padding-block:2px}
.tn{display:inline-block;padding:1px 8px;border-radius:99px;border:1.5px solid var(--ink-2)}
.tn.ok{border-color:var(--ok);color:var(--ok)}
.tn.crash,.tn.dead{border-color:var(--bad);color:var(--bad);background:rgba(214,48,76,.1)}
.tn.back{opacity:.5;text-decoration:line-through}
.tn.cur{box-shadow:0 0 0 2px var(--amber)}

/* district 4 */
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.moves{grid-template-columns:minmax(0,1fr)}}
.mv{border:2px solid var(--line);border-radius:14px;background:var(--surf);padding:8px 12px;text-align:left;transition:transform .1s}
.mv:hover:not(:disabled){transform:translateY(-2px)}
.mv b{display:block}
.mv span{font-size:12px;font-weight:700;color:var(--ink-2)}
.mv.best{background:var(--amber);border-color:var(--amber-d);color:#3A2100}.mv.best span{color:#5A3600}
.mv:disabled{opacity:.45}
.clashes{display:grid;gap:5px;font-size:13px;font-weight:700}
.clashes div span{color:var(--ink-2);font-weight:600}

/* district 5 */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:800;padding:3px 12px;border:1.5px solid var(--line);border-radius:99px;color:var(--ink-2);background:#fff}
.steps span.on{border-color:var(--amber-d);color:#8A4F00;background:#FFF1D6}
.steps span.done{border-color:var(--ok);color:var(--ok)}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(16,56,43,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surf);border:3px solid var(--amber);border-radius:24px;max-width:440px;width:100%;padding:24px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,60,30,.35);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.modal h2{font-size:28px;color:var(--teal)}
.modal .stars{font-size:40px;text-align:center}
.modal p{margin:0;font-weight:600}
@media (prefers-reduced-motion:reduce){.ovl,.modal,.vp.alarm::after{animation:none!important}}

/* gamified kit */
#fxl{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fxp{position:absolute;font-size:22px;will-change:transform}
.hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;max-width:72%}
.hud .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surf-a);border:2px solid var(--edge);border-radius:99px;padding:3px 12px 3px 9px;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(0,60,30,.22)}
.chip .cl{color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chip b{font-family:var(--f-display);font-weight:400;font-size:15px}
.chip.bump b{animation:bump .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.7);color:var(--amber-d)}100%{transform:scale(1)}}
.chip.lost{animation:shake .45s}
.sx{font-size:19px;line-height:1;color:rgba(16,56,43,.18);transition:color .3s,text-shadow .3s}
.sx.on{color:var(--amber);text-shadow:0 0 8px rgba(255,159,28,.7)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.prog{width:190px;max-width:100%;height:12px;border-radius:9px;background:var(--surf-a);border:2px solid var(--edge);overflow:hidden;box-shadow:0 3px 8px rgba(0,60,30,.2)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3DBE6E,#FFB84D);border-radius:9px;transition:width .6s cubic-bezier(.2,1.2,.3,1)}
.tiles{display:flex;flex-wrap:wrap;gap:14px;padding:10px 4px 6px;align-items:flex-end}
.ib{position:relative;display:grid;justify-items:center;gap:1px;padding:10px 12px 8px;min-width:92px;border-radius:20px;border:3px solid var(--edge);
  background:linear-gradient(180deg,var(--surf),var(--surf-2));box-shadow:0 5px 0 rgba(16,56,43,.2),0 10px 18px rgba(0,60,30,.12);transition:transform .15s,box-shadow .15s}
.ib .ico{font-size:34px;line-height:1.15;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));transition:transform .2s;display:grid;place-items:center;min-height:40px}
.ib .lbl{font-weight:800;font-size:13px}
.ib .sub{font-size:11px;font-weight:700;color:var(--ink-2)}
.ib:hover:not(:disabled){transform:translateY(-4px) rotate(-1.5deg)}
.ib:hover:not(:disabled) .ico{transform:scale(1.2) rotate(-7deg)}
.ib:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(16,56,43,.25)}
.ib.on{background:linear-gradient(180deg,#FFE29A,#FFB84D);box-shadow:0 5px 0 var(--amber-d),0 0 0 3px var(--amber),0 12px 22px rgba(255,159,28,.4);transform:translateY(-4px)}
.ib.t-go{background:linear-gradient(180deg,#C6F5D6,#5ED68F);box-shadow:0 5px 0 #2F9E5F,0 10px 18px rgba(0,100,50,.2)}
.ib.t-house{background:linear-gradient(180deg,#fff,#FFE0CF)}.ib.t-factory{background:linear-gradient(180deg,#fff,#DDE3EC)}
.ib.t-park{background:linear-gradient(180deg,#fff,#D4F4D4)}.ib.t-school{background:linear-gradient(180deg,#fff,#D9E4FF)}
.ib.on.t-house,.ib.on.t-factory,.ib.on.t-park,.ib.on.t-school{background:linear-gradient(180deg,#FFE29A,#FFB84D)}
.ib:disabled{opacity:.45;filter:grayscale(.7);cursor:not-allowed}
.ib.boing{animation:boing .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes boing{0%{transform:scale(1)}25%{transform:scale(.8,1.14)}55%{transform:scale(1.14,.88)}80%{transform:scale(.97,1.03)}100%{transform:scale(1)}}
.bdg{position:absolute;top:-9px;right:-9px;min-width:26px;height:26px;border-radius:99px;background:var(--surf);border:2.5px solid var(--ink-2);font-weight:800;font-size:12px;display:grid;place-items:center;padding:0 6px;animation:pop .35s cubic-bezier(.2,1.8,.4,1)}
.bdg.good{background:#D6F8E4;border-color:var(--ok);color:var(--ok)}.bdg.bad{background:#FFE0E6;border-color:var(--bad);color:var(--bad)}
.crown{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:20px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.lamp{display:block;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 45%,color-mix(in srgb,var(--c) 65%,#000) 100%);box-shadow:0 0 16px var(--c),inset 0 -4px 6px rgba(0,0,0,.2)}
.quests{display:grid;gap:8px}
.qcount{float:right;background:var(--amber);color:#3A2100;border-radius:99px;padding:1px 10px;font-size:12px;font-family:var(--f-body);font-weight:800}
.rc{display:grid;grid-template-columns:46px 1fr 26px;gap:10px;align-items:center;padding:8px 10px;border-radius:16px;background:var(--surf);border:2.5px solid var(--line);font-weight:700;font-size:13.5px;transition:background .3s,border-color .3s}
.rc-ico{min-width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:17px;background:#EEF4EF;font-weight:800;letter-spacing:-1px;text-align:center;line-height:1.1}
.rc.ok{border-color:#74D69B;background:#EFFCF3}.rc.ok .rc-ico{background:#CDF4DC}
.rc.bad{border-color:#FF8DA0;background:#FFF0F3}.rc.bad .rc-ico{background:#FFD3DB}
.rc.wait .rc-txt{opacity:.8}
.rc-st{font-weight:800;font-size:18px;text-align:center}
.rc.ok .rc-st{color:var(--ok)}.rc.bad .rc-st{color:var(--bad)}.rc.wait .rc-st{color:var(--ink-2)}
.rc.just-ok{animation:okpop .8s}
@keyframes okpop{0%{transform:scale(1)}30%{transform:scale(1.07);box-shadow:0 0 0 7px rgba(53,208,127,.4)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(53,208,127,0)}}
.rc.just-bad{animation:shake .45s}
.csp-row{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;border-radius:12px;background:#EDF6EF;font-weight:800;font-size:13px;align-items:center}
.csp-v{color:var(--ink-2);font-weight:700}
.cspbox{gap:6px}
.fog{background:#FFF3D6;border:2px dashed var(--amber-d);border-radius:14px;padding:8px 12px;font-weight:800;margin-top:8px}
.mission{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.m-goal{background:linear-gradient(180deg,#FFB84D,var(--amber));color:#3A2100;font-weight:800;padding:6px 16px;border-radius:99px;box-shadow:0 3px 0 var(--amber-d)}
.m-star{background:var(--surf);border:2px solid var(--line);padding:5px 14px;border-radius:99px;font-weight:800;font-size:13px}
.learn summary{cursor:pointer;font-weight:800;color:var(--teal);list-style:none}
.learn summary::-webkit-details-marker{display:none}
.learn p{margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.ib,.ib .ico,.bdg,.crown,.rc,.chip{animation:none!important;transition:none!important}}

.ib{color:var(--ink)}
.ib.on,.ib.t-go{color:#2A1B05}.ib.on .sub,.ib.t-go .sub{color:#5A3600}
.iris{position:absolute;inset:0;z-index:5;background:linear-gradient(180deg,#8FD0F7,#CFEFD0);clip-path:circle(0% at var(--x,50%) var(--y,50%));transition:clip-path .65s cubic-bezier(.65,0,.35,1);pointer-events:none}
.iris.go{clip-path:circle(160% at var(--x,50%) var(--y,50%))}
.wrap.enter .vp{animation:vpIn .9s cubic-bezier(.2,.9,.3,1)}
.wrap.enter .dhead,.wrap.enter .learn,.wrap.enter .mission,.wrap.enter .side,.wrap.enter .dock{animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
.wrap.enter .learn{animation-delay:.08s}.wrap.enter .mission{animation-delay:.14s}.wrap.enter .side{animation-delay:.2s}.wrap.enter .dock{animation-delay:.26s}
@keyframes vpIn{from{transform:scale(1.14);opacity:0;filter:blur(8px)}}
@keyframes rise{from{transform:translateY(18px);opacity:0}}
@media (prefers-reduced-motion:reduce){.wrap.enter *{animation:none!important}.iris{display:none}}
/* night mode */
html,body{transition:background-color .6s}
html[data-mode="night"]{--night:#0A1230;--glass:rgba(20,32,66,.88);--ink:#E8F0FF;--ink-2:#A9BADB;--line:rgba(160,185,255,.28);--teal:#5FE0A0;--ok:#4FE39A;--bad:#FF7B93;--surf:#1A2A52;--surf-a:rgba(20,32,66,.94);--surf-2:#24396B;--edge:#33508A;color-scheme:dark}
html[data-mode="night"] body{background:linear-gradient(180deg,#0A1230 0,#0F1C44 340px,#0C1838 100%) fixed #0A1230}

/* immersive game screen */
body.ingame{overflow:hidden}

.gtop{grid-column:1/3;grid-row:1;z-index:2;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));display:grid;gap:8px;pointer-events:none}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* LOGIC START */
const SIGK=['R','Y','G'];
const LASTV={};let KEEPV=false;
function pickVariant(key,n){const dv=globalThis.__DEMOV;if(dv&&dv[key]!==undefined)return dv[key];if(KEEPV&&LASTV[key]!==undefined){KEEPV=false;return LASTV[key];}KEEPV=false;let k;do{k=Math.floor(Math.random()*n);}while(n>1&&k===LASTV[key]);LASTV[key]=k;return k;}
const SIGN={R:'Red',Y:'Yellow',G:'Green'};
function nbOf(g){const m={};g.nodes.forEach(n=>m[n.id]=[]);g.edges.forEach(([a,b])=>{m[a].push(b);m[b].push(a);});return m;}

/* District 1: Blueprint Hall */
const D1={plots:['A','B','C','D','E','F'],types:['House','Factory','Park','School']};
D1.nb={};
D1.plots.forEach((p,i)=>{D1.nb[p]=D1.plots.filter((q,j)=>Math.abs(Math.floor(i/3)-Math.floor(j/3))+Math.abs(i%3-j%3)===1);});
D1.un={plot:'A',type:'Factory'};
const D1V=[['A','Factory'],['C','Factory'],['D','Factory'],['F','Factory'],['B','Park'],['E','Park'],['B','House'],['E','House']];
function d1Variant(k){D1.un={plot:D1V[k][0],type:D1V[k][1]};}
function d1Check(a){
  const P=D1.plots,nb=D1.nb,full=P.every(p=>a[p]);
  const pair=(t1,t2)=>{const s=new Set();for(const p of P)for(const q of nb[p])if(a[p]===t1&&a[q]===t2){s.add(p);s.add(q);}return [...s];};
  const out=[];
  let bad=pair('Factory','School');
  out.push({tag:'binary',text:'A Factory is never next to a School',status:bad.length?'bad':'ok',plots:bad});
  bad=pair('Factory','House');
  out.push({tag:'binary',text:'A Factory is never next to a House',status:bad.length?'bad':'ok',plots:bad});
  bad=a[D1.un.plot]===D1.un.type?[D1.un.plot]:[];
  out.push({tag:'unary',text:'Plot '+D1.un.plot+' cannot be a '+D1.un.type,status:bad.length?'bad':'ok',plots:bad});
  const pb=[];let pw=false;
  for(const p of P)if(a[p]==='Park'){if(nb[p].some(q=>a[q]==='House'))continue;if(nb[p].every(q=>a[q]))pb.push(p);else pw=true;}
  out.push({tag:'binary',text:'Every Park touches a House',status:pb.length?'bad':pw?'wait':'ok',plots:pb});
  const fs=P.filter(p=>a[p]==='Factory');
  out.push({tag:'global',text:'Exactly one Factory in the city',status:fs.length>1?'bad':fs.length===1?'ok':full?'bad':'wait',plots:fs.length>1?fs:[]});
  const ss=P.filter(p=>a[p]==='School');
  out.push({tag:'global',text:'At least one School',status:ss.length?'ok':full?'bad':'wait',plots:[]});
  return out;
}
function d1Solved(a){return D1.plots.every(p=>a[p])&&d1Check(a).every(r=>r.status==='ok');}

/* District 2: Traffic Tower (wheel of junctions plus one extra) */
const D2={nodes:[{id:'J0',x:260,y:190}],edges:[]};
for(let i=0;i<6;i++){const ang=(-90+60*i)*Math.PI/180;D2.nodes.push({id:'J'+(i+1),x:Math.round(260+140*Math.cos(ang)),y:Math.round(190+140*Math.sin(ang))});}
D2.nodes.push({id:'J7',x:490,y:190});
for(let i=1;i<=6;i++){D2.edges.push(['J0','J'+i]);D2.edges.push(['J'+i,'J'+(i%6+1)]);}
D2.edges.push(['J7','J2'],['J7','J3']);
D2.nb=nbOf(D2);
/* the extra junction J7 hangs off one pair of neighbouring ring junctions; six layouts of the same puzzle */
function d2Variant(i){const a=(-90+60*i+30)*Math.PI/180,j=(i+1)%6+1;
  D2.nodes[7]={id:'J7',x:Math.round(260+205*Math.cos(a)),y:Math.round(190+205*Math.sin(a))};
  D2.edges=D2.edges.filter(e=>e[0]!=='J7'&&e[1]!=='J7');D2.edges.push(['J7','J'+(i+1)],['J7','J'+j]);D2.nb=nbOf(D2);}
/* plain backtracking in random order versus MRV + Degree + LCV, counted on this very map */
function d2Bench(){
  const ids=D2.nodes.map(n=>n.id),nb=D2.nb;
  function run(pick,order){const asg={};let assigns=0,backs=0;
    const legal=v=>SIGK.filter(c=>!nb[v].some(u=>asg[u]===c));
    (function rec(){const un=ids.filter(n=>asg[n]===undefined);if(!un.length)return true;const v=pick(un,asg,legal);
      for(const c of order(v,asg,legal)){asg[v]=c;assigns++;if(!nb[v].some(u=>asg[u]===c)&&rec())return true;delete asg[v];backs++;}return false;})();
    return {assigns,backs};}
  const rnd=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>[...a].sort(()=>Math.random()-.5);
  let ra=0,rb=0;const T=300;
  for(let i=0;i<T;i++){const r=run(un=>rnd(un),()=>shuf(SIGK));ra+=r.assigns;rb+=r.backs;}
  const free=(v,asg)=>nb[v].filter(u=>asg[u]===undefined).length;
  const mrv=(un,asg,legal)=>[...un].sort((a,b)=>legal(a).length-legal(b).length||free(b,asg)-free(a,asg))[0];
  const lcv=(v,asg,legal)=>[...legal(v)].sort((x,y)=>nb[v].filter(u=>asg[u]===undefined&&legal(u).includes(x)).length-nb[v].filter(u=>asg[u]===undefined&&legal(u).includes(y)).length);
  const h=run(mrv,lcv);
  return {rand:{assigns:Math.round(ra/T),backs:Math.round(rb/T)},heur:h};
}
function d2Legal(asg,v){return SIGK.filter(c=>!D2.nb[v].some(u=>asg[u]===c));}

/* District 3: Power Grid */
const SRC=[{k:'S',name:'Solar',hex:0xFFC83D},{k:'W',name:'Wind',hex:0x5FD4F0},{k:'C',name:'Coal',hex:0x8790AD}];
const D3={nodes:[
  {id:'A',name:'Hospital',x:110,y:110,h:2.0},{id:'B',name:'Town Hall',x:280,y:110,h:2.5},{id:'C',name:'Mall',x:450,y:110,h:1.3},
  {id:'D',name:'School',x:110,y:270,h:1.9},{id:'E',name:'Factory',x:280,y:270,h:2.3},{id:'F',name:'Stadium',x:450,y:270,h:1.4}],
  edges:[['A','B'],['B','C'],['A','D'],['B','E'],['C','F'],['D','E'],['E','F'],['A','E'],['B','F']],eq:[],dom:{}};
D3.nb=nbOf(D3);
/* three boards: each has "must differ" links (cables) plus one "must match" link (amber), and its own allowed sources */
const D3V=[
  {dom:{A:'SW',B:'CS',C:'WCS',D:'SW',E:'SC',F:'WS'},eq:[['C','E']]},
  {dom:{A:'WS',B:'CWS',C:'WC',D:'SW',E:'SWC',F:'WC'},eq:[['B','D']]},
  {dom:{A:'SW',B:'CW',C:'SC',D:'WS',E:'CSW',F:'WSC'},eq:[['A','F']]}];
function d3Variant(k){const V=D3V[k],ord=q=>'SWC'.split('').filter(ch=>q.includes(ch)).join('');
  D3.dom={};for(const id in V.dom)D3.dom[id]=ord(V.dom[id]);D3.eq=V.eq;D3.arcs=[];
  D3.edges.forEach(([x,y])=>{D3.arcs.push([x,y,'ne'],[y,x,'ne']);});D3.eq.forEach(([x,y])=>{D3.arcs.push([x,y,'eq'],[y,x,'eq']);});}
d3Variant(0);
function d3Start(){const d={};for(const k in D3.dom)d[k]=new Set(D3.dom[k].split(''));return d;}
function d3Clone(d){const n={};for(const k in d)n[k]=new Set(d[k]);return n;}
/* AC-3: revise every arc (x,y); drop any value of x that has no partner value in y; re-queue the arcs that point at x */
function d3Propagate(dom){
  const pruned=[],q=[...D3.arcs];
  while(q.length){
    const [x,y,t]=q.shift();let ch=false;
    for(const v of [...dom[x]]){
      const ok=[...dom[y]].some(w=>t==='ne'?w!==v:w===v);
      if(!ok){dom[x].delete(v);pruned.push({node:x,val:v});ch=true;}
    }
    if(ch){if(dom[x].size===0)return{ok:false,pruned,wipe:x};D3.arcs.forEach(r=>{if(r[1]===x&&r[0]!==y)q.push(r);});}
  }
  return{ok:true,pruned};
}

/* District 4: Emergency Room */
const D4={shifts:['Morning','Evening','Night'],cap:3,limit:12,eventAt:3,
  docs:['Ana','Ben','Cai','Dev','Eli','Fay'],newDoc:'Gus',
  clashes:[['Ana','Ben'],['Ben','Cai'],['Cai','Dev'],['Dev','Eli'],['Eli','Fay'],['Fay','Ana'],['Ana','Dev'],['Gus','Ana'],['Gus','Fay']],
  unavail:{Cai:2,Eli:0},
  init:{Ana:0,Ben:0,Cai:2,Dev:0,Eli:0,Fay:1},gusAt:0};
const D4BASE={clashes:D4.clashes,unavail:D4.unavail,init:D4.init};
const D4V=[D4BASE,
  {clashes:[['Gus','Eli'],['Gus','Ana'],['Eli','Ben'],['Dev','Cai'],['Eli','Ana'],['Ana','Fay'],['Cai','Fay'],['Ben','Dev']],unavail:{Dev:2,Cai:1},init:{Ana:2,Ben:1,Cai:1,Dev:2,Eli:1,Fay:0}},
  {clashes:[['Ana','Cai'],['Fay','Gus'],['Eli','Ben'],['Fay','Eli'],['Cai','Ben'],['Fay','Cai'],['Eli','Dev'],['Dev','Gus']],unavail:{Ana:0,Dev:0},init:{Ana:1,Ben:2,Cai:1,Dev:0,Eli:2,Fay:0}},
  {clashes:[['Cai','Ben'],['Gus','Cai'],['Eli','Gus'],['Fay','Gus'],['Eli','Fay'],['Ana','Cai'],['Ana','Dev'],['Dev','Cai']],unavail:{Ben:0,Ana:2},init:{Ana:0,Ben:1,Cai:0,Dev:0,Eli:2,Fay:2}}];
function d4Variant(k){const V=D4V[k];D4.clashes=V.clashes;D4.unavail=V.unavail;D4.init=V.init;}
function d4Conf(a,who,s){
  let c=0;
  for(const [x,y] of D4.clashes){const o=x===who?y:y===who?x:null;if(o&&a[o]===s)c++;}
  if(D4.unavail[who]===s)c++;
  let load=0;for(const k in a)if(k!==who&&a[k]===s)load++;
  if(load>=D4.cap)c++;
  return c;
}
function d4Why(a,who){
  const s=a[who],out=[];
  for(const [x,y] of D4.clashes){const o=x===who?y:y===who?x:null;if(o&&a[o]===s)out.push('clashes with '+o);}
  if(D4.unavail[who]===s)out.push('unavailable for '+D4.shifts[s]);
  let load=0;for(const k in a)if(k!==who&&a[k]===s)load++;
  if(load>=D4.cap)out.push('shift is full');
  return out;
}
/* the surprise doctor always lands where he clashes, so a repair is always needed */
function d4GusShift(a){let b=-1,bs=0;for(let s=0;s<3;s++){const c=d4Conf({...a,[D4.newDoc]:s},D4.newDoc,s);if(c>b){b=c;bs=s;}}return bs;}
function d4Unhappy(a){return Object.keys(a).filter(k=>d4Conf(a,k,a[k])>0);}

/* District 5: Metro Map */
const D5={nodes:[
  {id:'c',name:'Central',x:200,y:190},{id:'h',name:'Harbor',x:70,y:90},{id:'m',name:'Museum',x:70,y:290},
  {id:'a',name:'Airport',x:330,y:90},{id:'s',name:'Stadium',x:330,y:290},
  {id:'l',name:'Library',x:440,y:60},{id:'k',name:'Market',x:500,y:150},{id:'o',name:'Old Town',x:440,y:240},
  {id:'p',name:'Park',x:440,y:325},{id:'z',name:'Zoo',x:515,y:325}],
  edges:[['c','h'],['c','m'],['h','m'],['c','a'],['c','s'],['a','s'],['l','k'],['k','o'],['p','z']]};
function d5Info(removed){
  const keep=D5.nodes.map(n=>n.id).filter(id=>!removed.has(id));
  const edges=D5.edges.filter(([a,b])=>!removed.has(a)&&!removed.has(b));
  const adj={};keep.forEach(id=>adj[id]=[]);edges.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a);});
  const comp={},order=[];let nc=0;
  for(const id of keep){
    if(id in comp)continue;
    comp[id]=nc;order.push({id,parent:null});const q=[id];
    while(q.length){const u=q.shift();for(const w of adj[u])if(!(w in comp)){comp[w]=nc;order.push({id:w,parent:u});q.push(w);}}
    nc++;
  }
  return{keep,edges,adj,comp,nc,order,loops:edges.length-keep.length+nc};
}
function d5Solve(removed,col){
  const info=d5Info(removed),dom={};
  for(const id of info.keep){
    dom[id]=new Set(SIGK);
    for(const [a,b] of D5.edges){const o=a===id?b:b===id?a:null;if(o&&removed.has(o))dom[id].delete(col[o]);}
  }
  for(const {id,parent} of [...info.order].reverse()){
    if(dom[id].size===0)return{ok:false,bad:id};
    if(!parent)continue;
    if(dom[id].size===1)dom[parent].delete([...dom[id]][0]);
    if(dom[parent].size===0)return{ok:false,bad:parent};
  }
  const res={},seq=[];
  for(const {id,parent} of info.order){
    const opts=[...dom[id]].filter(v=>!parent||v!==res[parent]);
    if(!opts.length)return{ok:false,bad:id};
    res[id]=opts[0];seq.push([id,opts[0]]);
  }
  return{ok:true,res,seq};
}
const D5V=[D5.edges,
  [['a','l'],['c','h'],['k','p'],['k','z'],['s','o'],['a','k'],['p','z'],['c','m'],['l','k']],
  [['c','m'],['a','o'],['k','z'],['c','h'],['o','p'],['l','o'],['s','p'],['s','o'],['a','l']]];
function d5Variant(k){D5.edges=D5V[k];}
/* LOGIC END */

/* ================= UI helpers ================= */
const SVGT=new Set([]);
function el(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='text')e.textContent=v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}
  return e;
}
const store={
  load(){try{return JSON.parse(localStorage.getItem('constraintquest')||'{}');}catch(e){return {};}},
  save(v){if(window.__DEMO)return;try{localStorage.setItem('constraintquest',JSON.stringify(v));}catch(e){}}
};
let progress=store.load();
const app=document.getElementById('app');
const starsEl=n=>el('span',{class:'stars','aria-label':n+' of 3 stars'},[1,2,3].map(i=>el('span',{class:i<=n?'on':''},'★')));
const rate=(v,t3,t2)=>v<=t3?3:v<=t2?2:1;
const SIGHEX={R:0xFF4D5E,Y:0xFFC83D,G:0x3DF09A};
const SIGCSS={R:'#FF4D5E',Y:'#FFC83D',G:'#3DF09A'};

/* sound */
let muted=false,actx=null;
function sfx(kind){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes={place:[420,560],pop:[760],good:[523,659,784],bad:[190,130],zap:[140,90,60],honk:[349,349],win:[523,659,784,1046,1318]}[kind]||[440];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+i*.09;
      o.type=(kind==='bad'||kind==='zap')?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.09,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.28);
      o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+.32);});
  }catch(e){}
}

}

/* ---------- day / night (whole game) ---------- */
const MODE={night:false,v:0,anim:0};
function setMode(night,instant){
  MODE.night=night;
  try{localStorage.setItem('cqmode',night?'night':'day');}catch(e){}
  document.documentElement.dataset.mode=night?'night':'day';
  const from=MODE.v,to=night?1:0;
  cancelAnimationFrame(MODE.anim);
  if(instant){MODE.v=to;return;}
  const t0=performance.now();
  const step=now=>{const q=Math.min(1,(now-t0)/1000);MODE.v=from+(to-from)*(q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2);if(q<1)MODE.anim=requestAnimationFrame(step);};
  MODE.anim=requestAnimationFrame(step);
}
/* ================= 3D engine ================= */
const E={
  out:t=>1-Math.pow(1-t,3),
  inout:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  lin:t=>t,
  back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);},
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;}
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let currentStage=null;
function disposeStage(){if(currentStage){currentStage.dispose();currentStage=null;}}

function Stage(host,o={}){
  const S={pick:[],labs:[],anims:[],parts:[],time:0,disposed:false,zoomK:1,inset:{t:0,r:0,b:0,l:0}};
  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  }catch(err){
    host.append(el('div',{class:'nogl'},'This game draws in 3D and needs WebGL. Try a recent version of Chrome, Edge, Safari or Firefox.'));
    return null;
  }

function netSnap(x,z,plain){

function junctionOf(seg){

function netRoute(A,B){

          else{b.classList.add('bad');b.disabled=true;fb.textContent='\u2717 Not quite. '+r.hint;fb.className='mwfb bad';sfx('bad');}}},o);btns.push(b);});
        const rowEl=el('div',{class:'mwrow'},el('div',{class:'mwk'},(ri+1)+'/3  '+r.k+': '+r.q),el('div',{class:'mwopts'},btns),fb);rowEl.hidden=ri>0;rowEls.push(rowEl);return rowEl;});
      mwBox.replaceChildren(el('div',{class:'mwh'},'\uD83E\uDDE0 Model it! Problem '+(pi+1)+' of '+MW.length+' \u00B7 '+P.title),el('p',{class:'mws'},P.story),...rows,el('div',{class:'row'},nextBtn));
    }
    show();
  }
  ctx.probe=()=>({S,whole,step,removed:[...removed],col:{...col},done,busy,view,MW});
  setStep(step);if(step===0)modelWorkshop();
}

/* ================= Demo mode: press Shift+P (or open the page with ?demo) and the game plays itself for a screen recording. Esc stops it. ================= */
(function(){
  const QS=new URLSearchParams(location.search);
  const SPEED=Math.max(.5,Math.min(2,parseFloat(QS.get('speed'))||1));
  const SHOWTOPIC=QS.get('topics')!=='0';
  const DEMOV={d1:0,d2:0,d3:1,d4:0,d5:0};
  const TOPIC=['Overview of CSP · variables, domains, constraints','Backtracking search · MRV, Degree, LCV','Constraint propagation · AC-3','Min-conflicts · local search repair','Structure and modelling · cutset, tree solving'];
  const DWELL=[2800,5000,3000,3000,3600];
  const STOP={stop:true};
  if(QS.get('sound')==='0')muted=true;
  if(QS.has('demo'))window.__DEMO=true;   /* no first-visit tutorial pop-up behind the countdown */
  let running=false,abort=false,cursor=null,tagEl=null;

  /* ---- timing helpers ---- */
  const raw=ms=>new Promise(r=>setTimeout(r,ms));
  async function wait(ms){const end=Date.now()+ms;while(Date.now()<end){if(abort)throw STOP;await raw(Math.min(80,Math.max(1,end-Date.now())));}if(abort)throw STOP;}
  const sleep=ms=>wait(ms/SPEED);
  async function until(fn,ms,what){const t0=Date.now();for(;;){if(abort)throw STOP;let v=false;try{v=fn();}catch(e){}if(v)return v;if(Date.now()-t0>(ms||40000))throw new Error('Demo timed out waiting for '+(what||'something'));await raw(80);}}
  const q=s=>document.querySelector(s);
  const tileSel=k=>'.ib[data-k="'+k+'"]';

  /* ---- the on-screen mouse pointer ---- */
  function mkCursor(){
    const c=document.createElement('div');c.id='democur';
    c.innerHTML='<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 2l15 9-6.5 1.6L9.6 19z" fill="#fff" stroke="#17202e" stroke-width="1.6" stroke-linejoin="round"/></svg><i></i>';
    c.style.transform='translate('+Math.round(innerWidth*.62)+'px,'+Math.round(innerHeight*.58)+'px)';
    c._p=[innerWidth*.62,innerHeight*.58];document.body.append(c);return c;
  }
  function ripple(){cursor.classList.remove('click');void cursor.offsetWidth;cursor.classList.add('click');}
  async function moveTo(x,y){
    const p=cursor._p,d=Math.hypot(x-p[0],y-p[1]),ms=Math.max(300,Math.min(750,d*1.0))/SPEED;
    cursor.style.transitionDuration=ms+'ms';cursor.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';cursor._p=[x,y];
    await wait(ms+50);
  }
  async function clickSel(sel,what){
    const node=await until(()=>{const n=q(sel);return n&&!n.disabled&&n;},15000,what||sel);
    const r=node.getBoundingClientRect();
    await moveTo(r.left+r.width/2,r.top+r.height/2);
    ripple();await sleep(110);
    const again=q(sel);(again&&!again.disabled?again:node).click();
    await sleep(140);
  }
  async function clickEl(node){
    const r=node.getBoundingClientRect();
    await moveTo(r.left+r.width/2,r.top+r.height/2);
    ripple();await sleep(110);node.click();await sleep(140);
  }

  /* ---- pointing at things in the 3D scene: real pointer events on the canvas ---- */
  const worldOf=(obj,dy)=>{const v=new THREE.Vector3().setFromMatrixPosition(obj.matrixWorld);v.y+=dy||0;return v;};
  function screenOf(v3){
    const S=currentStage,cv=q('.game canvas'),r=cv.getBoundingClientRect(),v=v3.clone().project(S.camera);
    return [r.left+(v.x*.5+.5)*r.width,r.top+(-v.y*.5+.5)*r.height,cv];
  }
  function fire(cv,type,x,y){
    cv.dispatchEvent(new PointerEvent(type,{clientX:x,clientY:y,pointerId:7,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1,bubbles:true,cancelable:true}));
  }
  const rc=new THREE.Raycaster(),nd=new THREE.Vector2();
  function hitAt(x,y,cv){
    const S=currentStage,r=cv.getBoundingClientRect();
    nd.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);rc.setFromCamera(nd,S.camera);
    for(const h of rc.intersectObjects(S.pick,true)){let o=h.object;while(o){if(S.pick.includes(o))return o;o=o.parent;}}
    return null;
  }
  /* aim at a point of obj that is not hidden behind another clickable object */
  function spotOn(getObj,dys){
    return()=>{const obj=getObj();
      for(const dy of dys)for(const dx of [0,-.28,.28]){const v=worldOf(obj,dy);v.x+=dx;const [x,y,cv]=screenOf(v);if(hitAt(x,y,cv)===obj)return v;}
      return worldOf(obj,dys[0]);};
  }
  async function clickAt(getVec){
    let [x,y,cv]=screenOf(getVec());
    await moveTo(x,y);
    [x,y,cv]=screenOf(getVec());
    cursor.style.transitionDuration='120ms';cursor.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';cursor._p=[x,y];
    fire(cv,'pointermove',x,y);await sleep(170);
    [x,y,cv]=screenOf(getVec());
    ripple();fire(cv,'pointerdown',x,y);fire(cv,'pointerup',x,y);
    await sleep(160);
  }

  /* ---- small on-screen extras ---- */
  function topic(i){
    if(!SHOWTOPIC)return;
    if(!tagEl){tagEl=document.createElement('div');tagEl.id='demotopic';document.body.append(tagEl);}
    if(i<0){tagEl.classList.remove('on');return;}
    tagEl.innerHTML='<b>Stage '+(i+1)+'</b><span>'+TOPIC[i]+'</span>';tagEl.classList.add('on');
  }
  async function countdown(){
    const o=document.createElement('div');o.id='democount';document.body.append(o);
    try{for(let n=3;n>0;n--){o.innerHTML='<b>'+n+'</b><small>Demo starting. Esc stops it.</small>';await wait(1000);}}finally{o.remove();}
  }

  /* ---- map ---- */
  async function tapGround(x,z){
    const [sx,sy,cv]=screenOf(new THREE.Vector3(x,.1,z));
    await moveTo(sx,sy);ripple();fire(cv,'pointermove',sx,sy);fire(cv,'pointerdown',sx,sy);fire(cv,'pointerup',sx,sy);await sleep(200);
  }
  async function mapIntro(){
    await until(()=>q('.game.map .qcard'),15000,'the map');
    await sleep(2000);
    await tapGround(-3.2,HZ);                       /* tap the street: Archie walks */
    await sleep(1500);
    await tapGround(PLAZA[0].sx,PLAZA[0].sz);       /* then onto the first stage plaza */
  }
  async function openStage(i){
    await until(()=>{const h=q('.qcard.near:not(.hide) h3');return h&&h.textContent.startsWith('Stage '+(i+1)+' ');},40000,'Archie at the gate of stage '+(i+1));
    await sleep(600);
    const prev=window.__ctx;
    await clickSel('.qcard.near .btn.primary','Play stage');
    await until(()=>window.__ctx&&window.__ctx!==prev&&window.__ctx.probe&&q('.game:not(.map) canvas'),15000,'stage '+(i+1)+' to open');
    topic(i);
    await sleep(1100);
    if(q('.learnpop.open')){await sleep(i===0?2400:700);await clickSel('.learnpop.open .btn.primary','Got it');await sleep(500);}
  }
  async function finishStage(i){
    await until(()=>q('.ovl .modal'),25000,'the win pop-up of stage '+(i+1));
    topic(-1);
    await sleep(DWELL[i]);
    await clickSel('.ovl .row .btn.primary','Continue');
    if(i<4){                                   /* let the unlock banner show, then skip the rest of the walk-over cutscene */
      await until(()=>q('.banner'),15000,'the cleared banner');
      await sleep(900);
      await tapGround(PLAZA[i+1].sx,PLAZA[i+1].sz);
    }
  }
  const probe=()=>window.__ctx.probe();

  /* ---- Stage 1: place buildings, make one visible mistake, fix it ---- */
  async function stage1(){
    const T=D1.types,P=D1.plots,sols=[];
    (function rec(i,a){if(i===6){if(d1Solved(a))sols.push({...a});return;}for(const t of T){a[P[i]]=t;rec(i+1,a);}delete a[P[i]];})(0,{});
    const sol=sols[0],F=P.find(p=>sol[p]==='Factory'),wrong=D1.nb[F][0];
    let tool=null;
    const place=async(type,p)=>{
      if(tool!==type){await clickSel(tileSel('d1'+type),type+' tile');tool=type;}
      await clickAt(spotOn(()=>probe().plots[p],[.3,.6]));
    };
    await sleep(700);
    await place('Factory',F);await sleep(700);
    await place('School',wrong);await sleep(2200);          /* next to the Factory: the rule card turns red */
    for(const type of ['Park','House','School'])
      for(const p of P)if(sol[p]===type&&probe().asg[p]!==type){await place(type,p);await sleep(500);}
  }

  /* ---- Stage 2: a dead end, Rewind, the three hints, then finish ---- */
  function solveD2(asg){
    const ids=D2.nodes.map(n=>n.id),a={...asg};
    (function rec(){const v=ids.find(x=>a[x]===undefined);if(!v)return true;for(const c of d2Legal(a,v)){a[v]=c;if(rec())return true;}delete a[v];return false;})();
    return a;
  }
  async function stage2(){
    const setJ=async(id,c)=>{await clickAt(spotOn(()=>probe().sig[id],[.9,.5,1.3]));await clickSel(tileSel('d2c'+c),'colour '+c);await sleep(350);};
    await sleep(600);
    await setJ('J1','R');await setJ('J2','G');await setJ('J3','Y');   /* three different colours around the hub */
    await sleep(2000);                                                 /* dead end: the hub has no colour left */
    await clickSel(tileSel('d2rw'),'Rewind');await sleep(1000);
    await clickSel(tileSel('d2mrv'),'MRV');await sleep(1600);
    await clickSel(tileSel('d2deg'),'Degree');await sleep(1400);
    await clickAt(spotOn(()=>probe().sig.J0,[.9,.5,1.3]));
    await clickSel(tileSel('d2lcv'),'LCV');await sleep(1600);
    const c0=d2Legal(probe().asg,'J0')[0];
    await clickSel(tileSel('d2c'+c0),'colour for the hub');await sleep(500);
    const sol=solveD2(probe().asg);
    for(;;){
      const asg=probe().asg,un=D2.nodes.map(n=>n.id).filter(x=>asg[x]===undefined);
      if(!un.length||probe().done)break;
      un.sort((x,y)=>d2Legal(asg,x).length-d2Legal(asg,y).length||D2.nb[y].filter(z=>asg[z]===undefined).length-D2.nb[x].filter(z=>asg[z]===undefined).length);
      await setJ(un[0],sol[un[0]]);
    }
  }

  /* ---- Stage 3: one choice, and propagation does the rest ---- */
  async function stage3(){
    await sleep(2200);
    for(let guard=0;guard<6&&!probe().done;guard++){
      const dom=probe().dom;let best=null;
      for(const id in dom){if(dom[id].size<2)continue;
        for(const v of dom[id]){const nd=d3Clone(dom);nd[id]=new Set([v]);const r=d3Propagate(nd);if(!r.ok)continue;
          const sc=(Object.values(nd).every(s=>s.size===1)?100:0)+r.pruned.length;if(!best||sc>best.sc)best={id,v,sc};}}
      if(!best)break;
      await clickAt(spotOn(()=>probe().cubes[best.id+best.v],[0,.2,-.2]));
      await sleep(3600);
    }
  }

  /* ---- Stage 4: repair a full schedule, a surprise doctor, one real algorithm step ---- */
  function planD4(a0,m0,ev0){
    for(const bestOnly of [true,false]){
      let fr=[{a:{...a0},m:m0,ev:ev0,path:[]}];const seen=new Set();
      for(let d=0;d<8&&fr.length;d++){const nf=[];
        for(const s of fr){const un=d4Unhappy(s.a);if(!un.length)return s.path;if(s.m>=D4.limit)continue;
          for(const w of un){const cs=[0,1,2].map(x=>x===s.a[w]?99:d4Conf(s.a,w,x)),b=Math.min(...cs);
            for(let x=0;x<3;x++){if(x===s.a[w]||(bestOnly&&cs[x]>b))continue;
              const a={...s.a,[w]:x};let ev=s.ev;const m=s.m+1;if(m===D4.eventAt&&!ev){ev=true;a[D4.newDoc]=d4GusShift(a);}
              const k=JSON.stringify([Object.keys(a).sort().map(y=>y+a[y]),m,ev]);if(seen.has(k))continue;seen.add(k);
              nf.push({a,m,ev,path:[...s.path,[w,x]]});}}}
        fr=nf;}
    }
    return null;
  }
  async function stage4(){
    let autoDone=false;
    await sleep(2200);
    for(let guard=0;guard<16&&!probe().done;guard++){
      const s=probe();
      if(s.event&&!autoDone){
        autoDone=true;await sleep(2800);                               /* the surprise doctor has just arrived */
        await clickSel(tileSel('d4auto'),'Auto');await until(()=>probe().flying===0||probe().done,8000,'the move');await sleep(1800);continue;
      }
      const plan=planD4(s.a,s.moves,s.event);
      if(!plan||!plan.length){await clickSel(tileSel('d4auto'),'Auto');await until(()=>probe().flying===0||probe().done,8000,'the move');await sleep(1200);continue;}
      const [w,sh]=plan[0];
      await clickAt(spotOn(()=>probe().docs[w],[1.4,1.1,.8,.5,.2]));
      await until(()=>{const b=q(tileSel('d4s'+sh));return b&&!b.disabled;},5000,'shift tiles');
      await sleep(1100);                                               /* let the crown on the best shift be seen */
      await clickSel(tileSel('d4s'+sh),'shift '+sh);
      await until(()=>probe().flying===0||probe().done,8000,'the doctor to land');await sleep(1000);
    }
  }

  /* ---- Stage 5: model it, find islands, close one station, solve the trees ---- */
  async function stage5(){
    await sleep(1800);
    for(let k=0;k<3;k++){
      await until(()=>{const h=q('.mw .mwh'),m=h&&h.textContent.match(/Problem (\d)/);return m&&+m[1]-1===k;},10000,'modelling problem '+(k+1));
      await sleep(k===0?1300:500);
      for(let r=0;r<3;r++){
        const row=await until(()=>{const x=document.querySelectorAll('.mw .mwrow')[r];return x&&!x.hidden&&x;},8000,'row '+(r+1));
        await sleep(k===0?400:100);
        await clickEl(row.querySelectorAll('.mwo')[probe().MW[k].rows[r].ok]);
        await sleep(k===0?900:450);
      }
      await clickSel('.mw .row .btn:not([hidden])','Next');
      await sleep(400);
    }
    await until(()=>probe().step===1,8000,'step 1');
    await sleep(1200);
    await clickSel(tileSel('d5vg'),'Graph view');await sleep(2500);
    await clickSel(tileSel('d5vm'),'Metro view');await sleep(1000);
    const w=probe().whole;
    for(let c=0;c<w.nc;c++){const id=w.keep.find(i=>w.comp[i]===c);await clickAt(spotOn(()=>probe().S[id],[.6,1.2,.2]));await sleep(1000);}
    await clickSel(tileSel('d5n1'),'Next: break the loops');await sleep(900);
    const ids=D5.nodes.map(n=>n.id);let cut=null;
    const combos=(arr,k)=>k===0?[[]]:arr.flatMap((x,i)=>combos(arr.slice(i+1),k-1).map(r=>[x,...r]));
    for(let k=1;k<=3&&!cut;k++)cut=combos(ids,k).find(cb=>d5Info(new Set(cb)).loops===0)||null;
    for(const id of cut){await clickAt(spotOn(()=>probe().S[id],[.6,1.2,.2]));await sleep(1100);}
    await sleep(1100);
    await clickSel(tileSel('d5n2'),'Next: solve the trees');await sleep(900);
    const colour=SIGK.find(c=>{const col={};cut.forEach(id=>col[id]=c);return d5Solve(new Set(cut),col).ok;});
    for(const id of cut)for(let t=0;t<=SIGK.indexOf(colour);t++){await clickAt(spotOn(()=>probe().S[id],[.6,1.2,.2]));await sleep(400);}
    await sleep(700);
    await clickSel(tileSel('d5sv'),'Solve');
  }
  const STAGES=[stage1,stage2,stage3,stage4,stage5];

  async function run(){
    if(running)return;
    running=true;abort=false;
    const keep={progress,heroAt};
    let natural=false;
    try{
      document.querySelectorAll('.ovl').forEach(o=>o.remove());
      await countdown();
      document.querySelectorAll('.ovl').forEach(o=>o.remove());
      window.__DEMO=true;window.__DEMOV=DEMOV;
      progress={};heroAt=null;pending=null;LEARN_SEEN.clear();KEEPV=false;
      for(const k of Object.keys(LASTV))delete LASTV[k];
      for(const k of Object.keys(RULESEEN))delete RULESEEN[k];
      cursor=mkCursor();
      home();
      await mapIntro();
      for(let i=0;i<5;i++){await openStage(i);await STAGES[i]();await finishStage(i);}
      await until(()=>q('.banner'),20000,'the finale');
      await sleep(5500);
      natural=true;
    }catch(e){if(e!==STOP)console.error('Demo stopped:',e);}
    finally{
      abort=true;running=false;
      window.__DEMO=false;delete window.__DEMOV;
      progress=keep.progress;heroAt=keep.heroAt;pending=null;
      if(cursor){cursor.remove();cursor=null;}
      if(tagEl){tagEl.remove();tagEl=null;}
      document.querySelectorAll('#democount').forEach(o=>o.remove());
      document.querySelectorAll('.ovl').forEach(o=>o.remove());
      home();
      if(natural)console.log('Demo finished.');
    }
  }
  addEventListener('keydown',e=>{
    if(e.key==='Escape'&&running){abort=true;return;}
    if((e.key==='P'||e.key==='p')&&e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!running){e.preventDefault();run();}
  });
  window.cqDemo={run,stop:()=>{abort=true;}};
  if(QS.has('demo'))setTimeout(run,900);
})();

try{if(localStorage.getItem('cqmode')==='night')setMode(true,true);}catch(e){}
home();
</script>
